<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5d84e"><title>Verify your email — LemonBingo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f6f6f2;color:#24251f;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.card{width:min(430px,100%);background:white;border:1px solid #e8e7df;border-radius:20px;padding:30px;box-shadow:0 12px 40px #292a1b0c;text-align:center}
.logo{width:54px;height:54px;margin:0 auto 12px;border-radius:17px;background:#f5d84e;display:grid;place-items:center;font-size:30px}
h1{font-size:25px;letter-spacing:-.7px;margin:8px 0}p{color:#77786f;margin:8px 0 20px}
input{width:100%;padding:14px;border:1px solid #deded5;border-radius:12px;font:inherit;font-size:22px;letter-spacing:8px;text-align:center;outline:none}
input:focus{border-color:#d7c24e}button{width:100%;margin-top:13px;padding:13px;border:0;border-radius:11px;background:#f5d84e;color:#24251f;font:700 15px system-ui;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}.back{display:inline-block;margin-top:17px;color:#77786f;text-decoration:none;font-size:13px}
#message{min-height:24px;font-size:13px;margin:13px 0 0;color:#4c8b63}.email{font-size:13px;color:#4c4d45;overflow-wrap:anywhere}
</style></head><body>
<main class="card"><div class="logo">🍋</div><h1>Check your email</h1>
<p>Enter the 6-digit verification code we sent to:</p><div class="email" id="emailLabel"></div>
<form id="verifyForm"><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" aria-label="Six digit verification code" required><button id="verifyButton" type="submit">Verify email</button></form>
<p id="message" role="status"></p><a class="back" href="index.html">← Back to LemonBingo</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://krcpvikwajmejosirhoh.supabase.co","sb_publishable_w6hM7KLWqjygqJi1GJridg_BkgfuTmv");
const params=new URLSearchParams(location.search);const email=params.get("email")||sessionStorage.getItem("lemonbingo_verify_email")||"";
const label=document.getElementById("emailLabel"),form=document.getElementById("verifyForm"),code=document.getElementById("code"),message=document.getElementById("message"),button=document.getElementById("verifyButton");
label.textContent=email||"Email address missing";
form.addEventListener("submit",async e=>{e.preventDefault();if(!email){message.style.color="#b33b32";message.textContent="Email address missing. Return and create your account again.";return}
const token=code.value.replace(/\D/g,"");if(token.length!==6){message.style.color="#b33b32";message.textContent="Enter all 6 digits.";return}
button.disabled=true;message.style.color="#77786f";message.textContent="Checking your code...";
const {error}=await db.auth.verifyOtp({email,token,type:"signup"});
if(error){message.style.color="#b33b32";message.textContent=error.message;button.disabled=false;return}
sessionStorage.removeItem("lemonbingo_verify_email");message.style.color="#4c8b63";message.textContent="Email verified! Taking you to LemonBingo...";setTimeout(()=>location.href="index.html",900);
});code.focus();
</script></body></html>
